version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly, not weekly. A group PR opens whenever any member moved, and
    # lucide-react / eslint / @types/node move most weeks, so a weekly schedule
    # produced a wave of PRs every run. Security updates ignore this interval.
    schedule:
      interval: monthly
    # One open PR per group. A group that is still open is updated in place
    # on the next run instead of stacking another PR.
    open-pull-requests-limit: 3
    ignore:
      # Version-update majors only. update-types alone does not suppress
      # security updates. Do not add `versions` on this rule: combining
      # versions and update-types also filters security PRs.
      # Deferred majors (dedicated migration, not a bot PR): dockview 8,
      # Tailwind 4, TypeScript 7, Vitest 5, react-intl 12.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # First match wins. All runtime libraries live in devDependencies because
      # the published package is pre-bundled; group by role, not by npm
      # production vs development (the production group would be empty).
      # Groups stay minor/patch so a later removal of the major ignore cannot
      # drop dockview 8 / Tailwind 4 / TypeScript 7 into one failing bulk PR.
      peer-and-types:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "three"
          - "@types/three"
      bundled-runtime:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "@foxglove/*"
          - "@mcap/*"
          - "@ioai/*"
          - "@radix-ui/*"
          - "dockview*"
          - "sql.js"
          - "@types/sql.js"
          - "protobufjs"
          - "fflate"
          - "lz4js"
          - "zustand"
          - "react-intl"
          - "uplot"
          - "cytoscape"
          - "@types/cytoscape"
          - "comlink"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
          - "lucide-react"
          - "cmdk"
          - "eventemitter3"
          - "flatbuffers"
          - "intervals-fn"
          - "sonner"
          - "react-resizable-panels"
      toolchain:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Action bumps are almost always majors (and old majors get deprecated).
    # Keep those; just don't open one PR per action.
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
